    .header-action { width: var(--header-target-size); height: var(--header-target-size); }

    .login-board text {

    @media (prefers-reduced-motion: no-preference) {

        animation: wave-board 2.6s ease-in-out;
      }
    }
    /* ボードを握る位置を wave-hand の各姿勢の手先に合わせる。 */
    @keyframes wave-board {
      0%, 16%, 91%, 100% { opacity: 0; }
      22%, 52%, 82% { opacity: 1; transform: translate(20.1px, 4px) rotate(-4deg); }

    @media (prefers-reduced-motion: reduce) {

  <script>
    const control = document.querySelector('[data-account-preview-control]');
    const accountState = control.querySelector('[data-account-state]');
    const cartState = control.querySelector('[data-cart-state]');
    const cartLink = document.querySelector('[data-cart-link]');
    const accountLink = document.querySelector('[data-account-link]');
    const loginPage = accountLink.href;

    function renderAccount() {
      const signedIn = accountState.value === 'signed-in';
      accountLink.classList.toggle('account-signed-in', signedIn);
      accountLink.href = signedIn ? '../../demo-scope.html' : loginPage;
      accountLink.title = signedIn ? 'マイページ（ログイン中）' : 'ログイン';
      accountLink.setAttribute('aria-label', accountLink.title);
    }

    accountState.value = new URLSearchParams(location.search).get('account') === 'signed-in' ? 'signed-in' : 'guest';
    function renderCart() {
      const hasItems = cartState.value === 'filled';
      cartLink.classList.toggle('has-items', hasItems);
      const count = hasItems ? 1 + Math.floor(Math.random() * 9) : 0;
      const badge = cartLink.querySelector('[data-cart-count]');
      badge.textContent = count || '';
      cartLink.title = hasItems ? 'カート（商品' + count + '点）' : 'カート（商品なし）';
      cartLink.setAttribute('aria-label', cartLink.title);
    }

    accountState.addEventListener('change', renderAccount);
    cartState.addEventListener('change', renderCart);
    renderAccount();
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
      document.querySelectorAll('[data-menu-store-label]').forEach((link) => {
        link.textContent = window.PROTO_DATA.store.name + link.dataset.menuStoreLabel;
      });
    });
  </script>
</body>
</html>
