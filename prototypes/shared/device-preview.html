<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>画面プレビュー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #edeae5; }
    main { position: relative; height: 100%; margin-inline: auto; }
    iframe { display: block; border: 0; transform-origin: top left; background: white; }
  </style>
</head>
<body>
  <main><iframe title="デモ画面"></iframe></main>
  <script>
    const frame = document.querySelector('iframe');
    const widths = { desktop: 1280, tablet: 820, mobile: 390 };
    const params = new URLSearchParams(location.search);
    const page = params.get('page') === 'municipality' ? 'municipality-claude' : 'top-codex-1';
    const filename = page === 'top-codex-1' && params.get('page') === 'account' ? 'account-preview.html' : 'index.html';
    let mode = Object.hasOwn(widths, params.get('view')) ? params.get('view') : 'auto';

    function resizePreview() {
      const width = widths[mode] || document.documentElement.clientWidth;
      const scale = Math.min(1, document.documentElement.clientWidth / width);
      frame.parentElement.style.width = width * scale + 'px';
      frame.style.width = width + 'px';
      frame.style.height = frame.parentElement.clientHeight / scale + 'px';
      frame.style.transform = 'scale(' + scale + ')';
    }
    window.devicePreview = {
      get mode() { return mode; },
      select(value) {
        mode = Object.hasOwn(widths, value) ? value : 'auto';
        const url = new URL(location.href);
        if (mode === 'auto') url.searchParams.delete('view');
        else url.searchParams.set('view', mode);
        history.replaceState(null, '', url);
        resizePreview();
        frame.contentWindow.dispatchEvent(new Event('previewmodechange'));
      }
    };
    window.addEventListener('resize', resizePreview);
    resizePreview();
    params.delete('page');
    params.delete('view');
    const target = new URL('../' + page + '/' + filename, location.href);
    target.search = params.toString();
    target.hash = location.hash;
    frame.src = target;
    frame.addEventListener('load', () => {
      let current;
      try { current = new URL(frame.contentWindow.location.href); } catch { return; }
      if (current.protocol === 'about:') return;
      if (!/\/(top-codex-1|municipality-claude)\/(index|account-preview)\.html$/.test(current.pathname)) {
        location.replace(current);
        return;
      }
      const url = new URL(location.href);
      url.search = current.search;
      url.searchParams.set('page', current.pathname.includes('/municipality-claude/') ? 'municipality' :
        current.pathname.endsWith('/account-preview.html') ? 'account' : 'gifts');
      if (mode !== 'auto') url.searchParams.set('view', mode);
      url.hash = current.hash;
      history.replaceState(null, '', url);
      document.title = frame.contentDocument.title;
    });
  </script>
</body>
</html>
